[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credmgr"
version = "2.0.0"
description = "A local-first CLI password manager with envelope-encrypted, versioned storage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Veerabadran M", github = "https://github.com/Veerabadran-M" },
]
keywords = ["password-manager", "credentials", "cli", "encryption", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "rich>=13.7.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
# Enables the "xchacha20poly1305" cipher choice (config: cipher).
# Not required for the default "aes256gcm" cipher.
xchacha20 = ["pynacl>=1.5.0"]

[project.scripts]
credmgr = "credmgr.cli:main"

[tool.setuptools.packages.find]
include = ["credmgr", "credmgr.*"]