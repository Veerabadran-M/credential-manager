[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credmgr"
version = "3.1.0"
description = "A local-first CLI password manager with pluggable cryptographic backends and envelope-encrypted storage"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Veerabadran M", email = "veerabadranm1@gmail.com" }
]

keywords = [
    "password-manager",
    "credential-manager",
    "credentials",
    "cli",
    "terminal",
    "security",
    "cryptography",
    "aes-gcm",
    "xchacha20",
    "encryption",
    "local-first",
    "plugin"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities"
]

dependencies = [
    "argon2-cffi>=23.1.0",
    "rich>=13.7.0",
    "pyperclip>=1.8.2",
    "typer>=0.12.0"
]

[project.optional-dependencies]
# credmgr's core never imports a crypto library directly -- each backend
# plugin (credmgr/crypto/plugins/) is only usable if its own dependency is
# installed. Install whichever backend(s) you plan to use, or "all" for
# every bundled backend. See the README's "Plugin Architecture" section.
cryptography = ["cryptography>=42.0.0"]
pynacl = ["PyNaCl>=1.5.0"]
pycryptodome = ["pycryptodome>=3.20.0"]
all = [
    "cryptography>=42.0.0",
    "PyNaCl>=1.5.0",
    "pycryptodome>=3.20.0"
]

[project.urls]
Homepage = "https://github.com/Veerabadran-M/credential-manager"
Repository = "https://github.com/Veerabadran-M/credential-manager"
Documentation = "https://github.com/Veerabadran-M/credential-manager#readme"
Issues = "https://github.com/Veerabadran-M/credential-manager/issues"
Changelog = "https://github.com/Veerabadran-M/credential-manager/releases"

[project.scripts]
credmgr = "credmgr.cli:main"

[tool.setuptools.packages.find]
include = ["credmgr", "credmgr.*"]